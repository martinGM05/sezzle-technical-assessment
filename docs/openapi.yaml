  "openapi": "3.1.0",
  "info": {
    "title": "Calculator API",
    "version": "1.0.0",
    "description": "Stored as JSON (valid YAML 1.2) so parity tests can read it with Go's standard library. CORS defaults to no allowed origins. The executable accepts comma-separated exact public HTTP(S) origins through ALLOWED_ORIGINS and supplies them to NewHandler. Configure the public HTTPS origin when TLS terminates at a same-origin reverse proxy. Forwarded headers do not grant origin access; invalid configured origins are ignored (fail closed); no wildcard, opaque null origin, or credentials. Requests without Origin remain available. Unknown paths return 404. Routing precedes CORS; CORS precedes method/media/body validation. HEAD responses never include a body. Body limit precedes JSON decoding."
  },
