server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker DNS permits backend container replacement without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8080;

    # Stream requests to Go, which owns the bounded body and Problem Details policy.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
